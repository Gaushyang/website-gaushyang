<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>動態圖示提案｜高祥電信</title>
  <link rel="stylesheet" href="icon-motion.css?v=2">

<body>
  <main class="demo">
    <header class="demo-head">
      <a class="back" href="./#top">← 返回網站</a>
      <span class="edition">ICON MOTION STUDY / 01</span>
    </header>
    <div class="intro">
      <p class="eyebrow">GAUSHYANG / SYSTEM ICONOGRAPHY</p>
      <h1>讓工程能力，<br><span>有自己的動態語言。</span></h1>
      <p class="lead">以細線圖示、藍色聚焦和短促的描線動作，呈現高祥電信的工程主題。點選圖示，可查看它在網站中的應用區塊。</p>
    </div>
    <section class="icon-stage" aria-label="高祥電信動態圖示展示">
      <div class="stage-head"><span>SELECT A SIGNAL</span><button id="motion-toggle" type="button" aria-pressed="false">暫停輪播 <span aria-hidden="true">Ⅱ</span></button></div>
      <div class="icon-grid">
        <button class="icon-tile is-active" type="button" data-title="基地台建設" data-detail="從站點條件到設備安裝，以明確的工程節點建立穩定連線。" aria-pressed="true"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8v46M23 54h18M16 54h32M22 44l10-24 10 24M20 18c-7 7-7 21 0 28M44 18c7 7 7 21 0 28M13 12c-11 11-11 31 0 42M51 12c11 11 11 31 0 42"/></svg><span>基地台建設</span><small>01</small></button>
        <button class="icon-tile" type="button" data-title="5G 網路優化" data-detail="量測、分析、調校，讓訊號品質回到可驗證的標準。" aria-pressed="false"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 43a28 28 0 0 1 48 0M15 43a20 20 0 0 1 34 0M23 43a11 11 0 0 1 18 0M32 43v11M26 54h12"/><circle cx="32" cy="43" r="3"/></svg><span>網路優化</span><small>02</small></button>
        <button class="icon-tile" type="button" data-title="低軌衛星" data-detail="地面終端與衛星鏈路整合，延伸偏遠場域的通訊韌性。" aria-pressed="false"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 22l12-12 28 28-12 12zM11 15l8-8M45 57l12-12M25 39l14-14M9 54c8-9 17-12 27-11M9 54h12M9 54V42"/><circle cx="32" cy="32" r="4"/></svg><span>低軌衛星</span><small>03</small></button>
        <button class="icon-tile" type="button" data-title="室內涵蓋" data-detail="依場域結構規劃訊號路徑，改善室內通訊死角。" aria-pressed="false"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 54V24l22-16 22 16v30H10zM20 54V37h24v17M32 24v5M24 22a12 12 0 0 1 16 0M18 17a20 20 0 0 1 28 0"/></svg><span>室內涵蓋</span><small>04</small></button>
        <button class="icon-tile" type="button" data-title="光纖傳輸" data-detail="以清楚的路由和測試資料，串接可靠的傳輸骨幹。" aria-pressed="false"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M9 18h14l12 14h20M9 32h15l11 0h20M9 46h14l12-14h20"/><circle cx="9" cy="18" r="3"/><circle cx="9" cy="32" r="3"/><circle cx="9" cy="46" r="3"/><circle cx="55" cy="32" r="4"/></svg><span>光纖傳輸</span><small>05</small></button>
        <button class="icon-tile" type="button" data-title="C-RAN 機房" data-detail="集中式機房施工整合，讓設備、配線與交付資料保持一致。" aria-pressed="false"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 10h44v44H10zM18 17h28v12H18zM18 35h28v12H18zM23 23h2M23 41h2M31 23h12M31 41h12M32 47v7"/></svg><span>C-RAN 機房</span><small>06</small></button>
        <button class="icon-tile" type="button" data-title="安全施工" data-detail="把風險辨識與現場防護，放在每次施工的第一步。" aria-pressed="false"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 7l22 9v14c0 13-9 22-22 27C19 52 10 43 10 30V16zM22 32l7 7 14-16"/></svg><span>安全施工</span><small>07</small></button>
        <button class="icon-tile" type="button" data-title="現場量測" data-detail="用儀器讀值與報告回應工程品質，而不是只靠主觀判斷。" aria-pressed="false"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M9 14h46v36H9zM15 39h7l5-13 7 20 6-12h9M24 55h16M32 50v5"/></svg><span>現場量測</span><small>08</small></button>
        <button class="icon-tile" type="button" data-title="跨區支援" data-detail="讓跨區調度與離島工程保持相同的協作節奏。" aria-pressed="false"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="23"/><path d="M9 32h46M32 9c-9 7-13 15-13 23s4 16 13 23M32 9c9 7 13 15 13 23s-4 16-13 23M32 9v46"/></svg><span>跨區支援</span><small>09</small></button>
        <button class="icon-tile" type="button" data-title="工程交付" data-detail="施工紀錄、測試報告與竣工文件，讓成果可以追溯。" aria-pressed="false"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 8h25l11 11v37H14zM39 8v12h11M21 29h22M21 37h22M21 45h14"/></svg><span>工程交付</span><small>10</small></button>
        <button class="icon-tile" type="button" data-title="持續連線" data-detail="從建置到維護，以工程能力支撐關鍵通訊。" aria-pressed="false"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 33c8-15 18-15 27 0s19 15 27 0M0 33c8 15 18 15 27 0s19-15 27 0"/><circle cx="32" cy="33" r="4"/></svg><span>持續連線</span><small>11</small></button>
        <button class="icon-tile" type="button" data-title="低碳工程" data-detail="從施工現場與能源使用開始，逐步落實永續作業。" aria-pressed="false"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M53 11C26 11 12 22 12 39c0 9 6 15 15 15 18 0 29-15 26-43zM17 49c9-11 18-18 33-28M32 35v14"/></svg><span>低碳工程</span><small>12</small></button>
      </div>
      <div class="readout" aria-live="polite"><span id="readout-index">01 / 40</span><strong id="readout-title">基地台建設</strong><div><p id="readout-detail">從站點條件到設備安裝，以明確的工程節點建立穩定連線。</p><a id="readout-location" href="./#solutions">配置位置：方案與交付 ↗</a></div></div>
    </section>
    <p class="note">互動：點選圖示可重播描線動畫；自動輪播可暫停。若系統設定「減少動態」，將停用輪播與描線效果。</p>
  </main>

</html>
